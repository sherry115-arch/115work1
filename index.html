<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學學習作品</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#edf7ff,#fff7fd);
    color:#26364a;
  }
  header{
    text-align:center;padding:22px 12px 12px;
  }
  h1{font-size:clamp(1.5rem,4vw,2.5rem);margin:.2em}
  p{font-size:clamp(1rem,2vw,1.2rem);margin:.4em}
  main{
    width:min(1100px,96vw);margin:auto;padding:12px 0 36px;
  }
  .card{
    background:#fff;border-radius:22px;padding:12px;
    box-shadow:0 10px 30px rgba(55,80,120,.16);
  }
  img{
    display:block;width:100%;height:auto;
    max-height:82vh;object-fit:contain;border-radius:14px;
  }
  .actions{text-align:center;margin:14px}
  button{
    border:0;border-radius:999px;padding:11px 20px;
    font-size:1rem;cursor:pointer;background:#e8f2ff;color:#27486d;
  }
</style>
</head>
<body>
<header>
  <h1>📐 數學學習作品</h1>
  <p>點選圖片可放大查看</p>
</header>
<main>
  <div class="card">
    <a href="IMG_6302.jpeg" target="_blank" title="開啟原圖">
      <img src="IMG_6302.jpeg" alt="數學第三冊第3單元前測評量試題">
    </a>
  </div>
  <div class="actions">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})">🚀 回到上方</button>
  </div>
</main>
</body>
</html>
